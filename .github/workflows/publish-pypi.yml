name: Publish to PyPI

on:
  push:
    # Trigger the workflow on tag pushes matching v* (e.g., v1.0.0)
    tags:
      - 'v*'
  # Dispatch is the recovery path. It takes no ref input: run it with the
  # tag selected as the workflow ref, so the published ref is always a real
  # tag and cannot be an arbitrary branch supplied as a string.
  workflow_dispatch:

permissions:
  contents: read

env:
  COOKBOOK_REF: 3b78ff2373d4f4dd5e8209c3324c4df245ed4665

# Verify-before-publish gate (see AGENTS.md):
#   build -> lib-tests -> cookbook-smoke -> cookbook-host-smoke
#         -> azure-e2e -> runtime-dependency-audit -> publish
# Tiered runtime verification before any PyPI upload:
#   * lib-tests            : the library's own unit suite (against the built wheel).
#   * cookbook-smoke       : downstream module-import checks (catches registration/import drift).
#   * cookbook-host-smoke  : install the candidate wheel into the cookbook, then boot a real func
#                            host + Azurite and run the cookbook HTTP e2e. This proves the candidate
#                            installs cleanly and the Functions host starts with it present in the
#                            environment. NOTE: the cookbook HTTP examples do not import this package,
#                            so this tier is a host-boot smoke, NOT proof of this package's own runtime
#                            behavior. Package-native runtime coverage is tracked separately.
#   * azure-e2e            : calls e2e-azure.yml to deploy to real Azure and run the live e2e suite
#                            against the tag being published. Because it runs inside this chain at
#                            the same ref, certification covers the exact published commit by
#                            construction -- no cross-run SHA/freshness matching is required.
#   * runtime-dependency-audit : installs the exact candidate wheel (base and [otel]) on the oldest
#                            and newest supported Python and fails on any known advisory in its
#                            runtime closure, an empty closure or an unauditable package, except
#                            dated exceptions in security/runtime-advisory-exceptions.txt (SECURITY.md).
# The publish job uploads the EXACT artifact that was tested; it never rebuilds.
# A tag whose gate fails is a failed release candidate: the version stays
# unpublished. Recover by fixing forward and cutting the next patch tag
# (never move a tag that may already have been consumed).
jobs:
  build:
    name: Build & verify version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Check if tag matches __version__
        id: version
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION_FROM_FILE=$(grep -Po '(?<=__version__ = ")[^"]*' src/azure_functions_logging/__init__.py)
          TAG_VERSION=${TAG_NAME#v}
          echo "Version from file: $VERSION_FROM_FILE"
          echo "Tag name: $TAG_NAME"
          echo "Version from tag: $TAG_VERSION"
          if [ "$VERSION_FROM_FILE" != "$TAG_VERSION" ]; then
            echo "::error ::Version in __init__.py ($VERSION_FROM_FILE) does not match git tag ($TAG_VERSION)"
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Build distribution packages
        run: python -m build

      - name: Upload distribution artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 5

  lib-tests:
    name: Library tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Hatch
        run: pip install hatch

      - name: Run test suite
        run: hatch run test

  cookbook-smoke:
    name: Cookbook dogfood smoke (candidate wheel)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cookbook (downstream consumer)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yeongseon/azure-functions-cookbook-python
          ref: ${{ env.COOKBOOK_REF }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Download candidate wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: candidate-dist

      - name: Install cookbook environment
        run: |
          pip install hatch
          make install

      - name: Install candidate wheel over the PyPI floor
        run: |
          WHEEL=$(ls candidate-dist/*.whl | head -n1)
          echo "Installing candidate wheel: $WHEEL"
          hatch run pip install --force-reinstall --no-deps "$WHEEL"

      - name: Verify candidate version is under test
        run: |
          EXPECTED="${{ needs.build.outputs.version }}"
          ACTUAL=$(hatch run python -c "import importlib.metadata as m; print(m.version('azure-functions-logging'))")
          echo "Expected candidate version: $EXPECTED"
          echo "Installed version:          $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error ::Cookbook is not exercising the candidate wheel ($ACTUAL != $EXPECTED)"
            exit 1
          fi

      - name: Run cookbook smoke tests against candidate
        run: hatch run smoke

  cookbook-host-smoke:
    name: Cookbook host-boot smoke (func + Azurite, candidate wheel)
    needs: build
    runs-on: ubuntu-latest
    env:
      # Pin Core Tools; bump only after a verified run. npm is Microsoft's
      # documented v4 install path (see e2e-azure.yml for rationale).
      FUNCTIONS_CORE_TOOLS_VERSION: "4.12.0"
    steps:
      - name: Checkout cookbook (downstream consumer)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yeongseon/azure-functions-cookbook-python
          ref: ${{ env.COOKBOOK_REF }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up Node.js (func Core Tools + Azurite)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install Azure Functions Core Tools + Azurite
        run: |
          npm install -g "azure-functions-core-tools@${FUNCTIONS_CORE_TOOLS_VERSION}" azurite
          func --version
          azurite --version

      - name: Download candidate wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: candidate-dist

      - name: Install cookbook environment
        run: |
          pip install hatch
          make install

      - name: Install candidate wheel over the PyPI floor
        run: |
          WHEEL=$(ls candidate-dist/*.whl | head -n1)
          echo "Installing candidate wheel: $WHEEL"
          hatch run pip install --force-reinstall --no-deps "$WHEEL"

      - name: Verify candidate version is under test
        run: |
          EXPECTED="${{ needs.build.outputs.version }}"
          ACTUAL=$(hatch run python -c "import importlib.metadata as m; print(m.version('azure-functions-logging'))")
          echo "Expected candidate version: $EXPECTED"
          echo "Installed version:          $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error ::Cookbook is not exercising the candidate wheel ($ACTUAL != $EXPECTED)"
            exit 1
          fi

      - name: Record reproducibility evidence
        run: |
          echo "Logging candidate SHA: ${{ github.sha }}"
          echo "Logging candidate version: ${{ needs.build.outputs.version }}"
          echo "Cookbook SHA: $(git rev-parse HEAD)"
          echo "Python: $(python --version)"
          echo "Core Tools: $(func --version)"
          echo "Azurite: $(azurite --version)"
          sha256sum candidate-dist/*.whl
          hatch run python -m pip freeze

      - name: Verify logging-specific collection
        run: |
          hatch run pytest --collect-only --no-cov -m "e2e and package_logging" tests/e2e/test_package_runtime.py \
            | tee /tmp/logging-collection.txt
          grep -Eq "^[1-9][0-9]*(/[0-9]+)? tests? collected" /tmp/logging-collection.txt

      - name: Boot cookbook func host with candidate wheel (host-smoke)
        run: |
          hatch run pytest -v -m "e2e and package_logging" \
            tests/e2e/test_package_runtime.py --no-cov --junitxml=pytest-results.xml
        timeout-minutes: 15

      - name: Upload sanitized host diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cookbook-logging-host-diagnostics
          path: |
            pytest-results.xml
            /tmp/azurite-*.log
            /tmp/func-*.log
          if-no-files-found: warn
          retention-days: 5

  azure-e2e:
    name: Azure release certification
    needs: build
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/e2e-azure.yml
    with:
      ref: ${{ needs.build.outputs.tag }}
      version: ${{ needs.build.outputs.version }}
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  runtime-dependency-audit:
    name: Runtime dependency audit (Py ${{ matrix.python }}, ${{ matrix.extras == '' && 'base' || matrix.extras }})
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # azure-functions resolves to different majors on 3.11-3.12 and 3.13-3.14, so one
        # interpreter is not enough; the oldest and newest bracket the supported range.
        # The key is `python`: tools/lint_hatch_matrix.py reads a `python-version` list as a Hatch test matrix.
        python: ["3.11", "3.14"]
        extras: ["", "[otel]"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Download the exact tested distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      - name: Audit the candidate's runtime closure (any known advisory blocks release)
        env:
          EXTRAS: ${{ matrix.extras }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/candidate"
          "$RUNNER_TEMP/candidate/bin/pip" install "$(ls dist/*.whl)${EXTRAS:-}"
          "$RUNNER_TEMP/candidate/bin/pip" freeze --exclude azure-functions-logging > req.txt
          test -s req.txt  # an empty closure must not pass vacuously
          ignores=$(python tools/runtime_audit_args.py security/runtime-advisory-exceptions.txt)
          echo "Advisory exceptions in effect: ${ignores:-none}"
          python -m pip install "pip-audit==2.10.1"
          # --strict: a package pip-audit cannot audit fails the gate instead of being skipped.
          # $ignores stays unquoted: one --ignore-vuln=ID word per waiver, ids validated (no globbing).
          # shellcheck disable=SC2086
          python -m pip_audit --no-deps --disable-pip --strict --desc off -f json -r req.txt $ignores | tee pip-audit.json

      - name: Upload the audit report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-audit-py${{ matrix.python }}-${{ matrix.extras == '' && 'base' || 'otel' }}-${{ github.run_attempt }}
          path: pip-audit.json
          retention-days: 30

  publish:
    name: Publish to PyPI
    needs: [build, lib-tests, cookbook-smoke, cookbook-host-smoke, azure-e2e, runtime-dependency-audit]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download tested distribution artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1 # pin-exempt: PyPA official publisher (trusted-publisher OIDC); tracks release/v1 by design

  notify-cookbook:
    name: Trigger cookbook e2e re-verification
    needs: [build, publish]
    runs-on: ubuntu-latest
    # This job never uses GITHUB_TOKEN (the cross-repo dispatch below authenticates
    # with COOKBOOK_DISPATCH_TOKEN), so drop all GITHUB_TOKEN scopes (#413).
    permissions: {}
    env:
      # Cross-repo repository_dispatch needs a token with contents:write on the
      # cookbook repo (GITHUB_TOKEN cannot cross repositories). Prefer a
      # fine-grained PAT scoped to azure-functions-cookbook-python contents:write
      # (or a GitHub App installation token) over a broad classic PAT, and rotate
      # on cutover — supply it via the COOKBOOK_DISPATCH_TOKEN secret. When it is
      # unset the step is skipped, so missing wiring never fails a release.
      DISPATCH_TOKEN: ${{ secrets.COOKBOOK_DISPATCH_TOKEN }}
    steps:
      - name: Dispatch sibling-release to cookbook
        if: ${{ env.DISPATCH_TOKEN != '' }}
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          curl -sSf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/yeongseon/azure-functions-cookbook-python/dispatches \
            -d "{\"event_type\":\"sibling-release\",\"client_payload\":{\"library\":\"azure-functions-logging\",\"version\":\"${VERSION}\"}}"
