name: e2e-azure

# Azure Release Certification. Dispatch-only: deploys to real Azure, runs live
# e2e, and records an azure-cert artifact for the exact release commit + version.
# The publish-pypi.yml verify-azure-certification gate requires a fresh, matching
# certification before it will publish.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Release commit SHA (or ref) to certify
        required: false
        type: string
      version:
        description: Expected package version (must match source __version__)
        required: false
        type: string

permissions:
  id-token: write
  contents: read

env:
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'koreacentral' }}
  REPO_SHORT: logging
  # Azure Functions Core Tools version (installed via npm in the install step below).
  # Pin exactly; bump only after a verified end-to-end run on a tag or workflow_dispatch.
  FUNCTIONS_CORE_TOOLS_VERSION: "4.12.0"

jobs:
  deploy_and_test:
    name: Deploy & Test
    runs-on: ubuntu-latest
    outputs:
      resource_group: ${{ steps.names.outputs.rg }}
      appinsights_name: ${{ steps.names.outputs.ai }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Compute resource names
        id: names
        run: |
          RUN="${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
          RG="rg-af-e2e-${REPO_SHORT}-${RUN}"
          APP="af-e2e-${REPO_SHORT}-${RUN}"
          ST="stafe2e${RUN}"
          ST="${ST:0:24}"
          AI="ai-af-e2e-${REPO_SHORT}-${RUN}"
          echo "rg=${RG}"   >> "$GITHUB_OUTPUT"
          echo "app=${APP}" >> "$GITHUB_OUTPUT"
          echo "st=${ST}"   >> "$GITHUB_OUTPUT"
          echo "ai=${AI}"   >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create Resource Group
        run: |
          az group create \
            --name "${{ steps.names.outputs.rg }}" \
            --location "$AZURE_LOCATION" \
            --tags purpose=e2e repo=azure-functions-logging run="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Deploy infra with App Insights (Bicep)
        run: |
          az deployment group create \
            --resource-group "${{ steps.names.outputs.rg }}" \
            --template-file infra/main.bicep \
            --parameters \
                location="$AZURE_LOCATION" \
                functionAppName="${{ steps.names.outputs.app }}" \
                storageName="${{ steps.names.outputs.st }}" \
                enableAppInsights=true \
                appInsightsName="${{ steps.names.outputs.ai }}"

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      # Install Azure Functions Core Tools via npm.
      # We previously installed from packages.microsoft.com via apt, but that feed
      # has hit stale-index 404s during Core Tools 4.x package transitions
      # (Azure/azure-functions-core-tools#4796) and there is no Microsoft-maintained
      # GitHub Action for Core Tools. npm is Microsoft's documented v4 install path
      # (see Azure/azure-functions-core-tools README) and is the same approach used
      # in Microsoft's own CI (e.g. microsoft/agent-framework,
      # Azure/azure-functions-durable-extension). Version is pinned via the
      # FUNCTIONS_CORE_TOOLS_VERSION env var declared at the workflow level.
      # Node is pinned explicitly so the install path stays reproducible across
      # GitHub-hosted runner image updates (the npm package requires Node >= 20).
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install Azure Functions Core Tools
        run: |
          npm install -g "azure-functions-core-tools@${FUNCTIONS_CORE_TOOLS_VERSION}"
          FUNC_VERSION="$(func --version)"
          echo "Installed func: ${FUNC_VERSION}"
          test "${FUNC_VERSION}" = "${FUNCTIONS_CORE_TOOLS_VERSION}"

      - name: Install library from source + test deps
        run: |
          pip install -e ".[dev]"
          pip install requests pytest pytest-html

      - name: Build candidate wheel and bundle into e2e app
        run: |
          python -m pip install --upgrade pip build
          FILE_VERSION=$(grep -Po '(?<=__version__ = ")[^"]*' src/azure_functions_logging/__init__.py)
          REQ_VERSION="${{ inputs.version }}"
          if [ -n "$REQ_VERSION" ] && [ "$REQ_VERSION" != "$FILE_VERSION" ]; then
            echo "::error ::Requested version ($REQ_VERSION) != source version ($FILE_VERSION)"
            exit 1
          fi
          RESOLVED_VERSION="${REQ_VERSION:-$FILE_VERSION}"
          echo "RESOLVED_VERSION=${RESOLVED_VERSION}" >> "$GITHUB_ENV"
          python -m build --wheel --outdir dist
          shopt -s nullglob
          wheels=(dist/azure_functions_logging-${RESOLVED_VERSION}-*.whl)
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "::error ::No candidate wheel matching version ${RESOLVED_VERSION} produced by python -m build"
            exit 1
          fi
          if [ ${#wheels[@]} -gt 1 ]; then
            echo "::error ::Expected exactly one candidate wheel for ${RESOLVED_VERSION}, found ${#wheels[@]}: ${wheels[*]}"
            exit 1
          fi
          WHEEL="${wheels[0]}"
          mkdir -p examples/e2e_app/wheels
          cp "$WHEEL" examples/e2e_app/wheels/
          BASENAME=$(basename "$WHEEL")
          # Append the locally-built candidate so the remote Oryx build installs it
          # instead of resolving azure-functions-logging from PyPI.
          echo "./wheels/${BASENAME}" >> examples/e2e_app/requirements.txt
          echo "Bundled candidate wheel: ${BASENAME} (version ${RESOLVED_VERSION})"
          cat examples/e2e_app/requirements.txt

      - name: Publish function app
        working-directory: examples/e2e_app
        run: |
          func azure functionapp publish "${{ steps.names.outputs.app }}" --python --build remote

      - name: Run e2e tests (HTTP + App Insights)
        run: pytest tests/e2e -v --no-cov --html=e2e-report/report.html --self-contained-html
        env:
          E2E_BASE_URL: https://${{ steps.names.outputs.app }}.azurewebsites.net
          E2E_EXPECTED_VERSION: ${{ env.RESOLVED_VERSION }}
          APPINSIGHTS_NAME: ${{ steps.names.outputs.ai }}
          E2E_RESOURCE_GROUP: ${{ steps.names.outputs.rg }}

      - name: Record certification
        run: |
          SHA=$(git rev-parse HEAD)
          FILE_VERSION=$(grep -Po '(?<=__version__ = ")[^"]*' src/azure_functions_logging/__init__.py)
          REQ_VERSION="${{ inputs.version }}"
          if [ -n "$REQ_VERSION" ] && [ "$REQ_VERSION" != "$FILE_VERSION" ]; then
            echo "::error ::Requested certification version ($REQ_VERSION) != source version ($FILE_VERSION)"
            exit 1
          fi
          VERSION="${REQ_VERSION:-$FILE_VERSION}"
          mkdir -p cert
          cat > cert/certification.json <<EOF
          {
            "package": "azure-functions-logging",
            "version": "$VERSION",
            "commit": "$SHA",
            "ref": "${{ inputs.ref || github.ref }}",
            "workflow": "e2e-azure.yml",
            "run_id": "${{ github.run_id }}",
            "result": "success",
            "certified_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat cert/certification.json

      - name: Upload certification record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: azure-cert
          path: cert/
          if-no-files-found: error
          retention-days: 30

      - name: Upload e2e report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e-report/
          retention-days: 30

  cleanup:
    name: Cleanup Azure Resources
    runs-on: ubuntu-latest
    needs: [deploy_and_test]
    if: always()
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Delete Resource Group
        run: |
          RG="${{ needs.deploy_and_test.outputs.resource_group }}"
          if [ -n "$RG" ]; then
            echo "Deleting resource group: $RG"
            az group delete --name "$RG" --yes --no-wait
          else
            echo "No resource group to delete."
          fi
