name: Test and Coverage

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      docs_changed: ${{ steps.classify.outputs.docs_changed }}
      full_required: ${{ steps.classify.outputs.full_required }}
    steps:
      - name: Checkout pull request head
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout trusted revision
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          printf 'docs_only=false\ndocs_changed=true\nfull_required=true\n' >> "$GITHUB_OUTPUT"
          changed_files=$(mktemp)
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if ! git cat-file -e "$HEAD_SHA^{commit}"; then
              git fetch --no-tags origin "+refs/pull/$PR_NUMBER/head:refs/remotes/origin/pull/$PR_NUMBER/head" || exit 0
            fi
            git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" > "$changed_files" || exit 0
          elif [ -n "$BEFORE_SHA" ] \
            && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$BEFORE_SHA^{commit}" \
            && git merge-base --is-ancestor "$BEFORE_SHA" "$SHA"; then
            git diff --name-only --no-renames "$BEFORE_SHA" "$SHA" > "$changed_files"
          else
            exit 0
          fi
          classification=$(tools/ci_classify_changes.sh < "$changed_files") || exit 0
          printf '%s\n' "$classification" >> "$GITHUB_OUTPUT"

  # Lint, type-check and security run once on a single pinned interpreter
  # (Python 3.11, matching the ruff/mypy target-version in pyproject). These
  # checks are interpreter-agnostic, so fanning them across the matrix would
  # only duplicate work. Installed with a plain `pip install -e '.[dev]'` so the
  # checks run on the interpreter this job provisions (NOT through the
  # Python-pinned Hatch env, which previously silently forced the whole test
  # matrix onto its default interpreter).
  quality:
    name: Lint, type-check & security (Py 3.11)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.full_required == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changed-file format check below diffs against the PR merge-base,
          # which a shallow clone does not contain.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint workflows (pin hygiene + release-gate canonical SHAs)
        run: |
          python tools/lint_release_workflows.py
          python tools/lint_workflow_pins.py

      - name: Hatch/matrix hygiene lint
        run: python tools/lint_hatch_matrix.py

      - name: Ruff style check
        run: |
          ruff check src tests tools examples benchmarks scripts
          ruff format --check src tests tools examples benchmarks scripts

      - name: Ruff format check (changed Python files)
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python tools/check_pr_format.py "$PR_BASE_SHA" "$PR_HEAD_SHA"

      - name: Type check (mypy, strict)
        run: mypy src tests

  test:
    name: Test (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.full_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        # This package declares no runtime dependency on `azure-functions`, so
        # the full test suite is honestly installable and runnable on every
        # supported interpreter. Python 3.14 is stable and required in this
        # matrix (not allow-fail).
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Assert the runtime interpreter matches the matrix cell
        # Tests must run on the interpreter this cell claims to exercise. Before
        # this fix the whole matrix ran through the default pinned Hatch env,
        # so 3.11-3.14 were never actually tested. This guard fails loudly if the
        # running interpreter ever drifts from matrix.python-version again.
        env:
          EXPECTED: ${{ matrix.python-version }}
        run: |
          python - <<'PY'
          import os, sys
          expected = tuple(int(p) for p in os.environ["EXPECTED"].split("."))
          actual = sys.version_info[: len(expected)]
          assert actual == expected, f"interpreter {actual} != matrix {expected}"
          print(f"interpreter OK: {sys.version.split()[0]}")
          PY

      - name: Install package with dev extras (on the matrix interpreter)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests on the matrix interpreter
        # Raw pytest on the interpreter provisioned above (NOT through the
        # default pinned Hatch env). The repo pytest config enables --cov
        # with fail_under=95; enforce that gate on the canonical 3.11 cell and
        # run the other cells with --no-cov so a version-variant cell cannot
        # fail the build on a spurious coverage dip.
        env:
          IS_COVERAGE_CELL: ${{ matrix.python-version == '3.11' }}
        run: |
          if [ "$IS_COVERAGE_CELL" = "true" ]; then
            pytest tests/
          else
            pytest tests/ --no-cov
          fi

      - name: Verify coverage output
        if: matrix.python-version == '3.11'
        run: ls -lh coverage.xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11' && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          verbose: true
          fail_ci_if_error: false
        env:
          CODECOV_RETRIES: 3

  minimum-dependencies:
    name: Minimum dependencies (Py 3.11)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.full_required == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install minimum runtime and pinned development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "azure-functions==1.21.0"
          pip install -e ".[dev]"

      - name: Report and assert resolved runtime dependencies
        run: |
          pip show azure-functions azure-functions-logging
          python - <<'PY'
          from importlib.metadata import version

          resolved = version("azure-functions")
          print(f"resolved azure-functions={resolved}")
          assert resolved == "1.21.0"
          PY

      - name: Run full suite against minimum runtime dependencies
        run: pytest tests/ --no-cov

  artifact-build:
    name: Build compatibility artifacts
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.full_required == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload compatibility artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compatibility-dist
          path: dist/
          if-no-files-found: error

  artifact-python310-negative:
    name: Wheel install rejection (Py 3.10, negative test)
    needs: [changes, artifact-build]
    if: needs.changes.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dependency metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.10 for negative install test
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Download built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: compatibility-dist
          path: compatibility-dist

      - name: Require wheel rejection by Requires-Python
        run: |
          wheel=$(find compatibility-dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          if output=$(python -m pip install --no-deps "$wheel" 2>&1); then
            echo "::error ::Python 3.10 unexpectedly installed the candidate wheel"
            exit 1
          fi
          printf '%s\n' "$output"
          grep -F "requires a different Python" <<<"$output"
          grep -F "3.10" <<<"$output"
          grep -F ">=3.11" <<<"$output"

  artifact-python311:
    name: Wheel install and smoke (Py 3.11)
    needs: [changes, artifact-build]
    if: needs.changes.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dependency metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Download built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: compatibility-dist
          path: compatibility-dist

      - name: Install wheel with runtime dependencies
        run: |
          wheel=$(find compatibility-dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          python -m pip install "$wheel"

      - name: Check installed wheel outside the checkout
        working-directory: /tmp
        env:
          CHECKOUT: ${{ github.workspace }}
        run: |
          python -m pip check
          python - <<'PY'
          import logging
          import os
          from pathlib import Path

          import azure_functions_logging
          from azure_functions_logging import JsonFormatter, get_logger

          module_path = Path(azure_functions_logging.__file__).resolve()
          checkout = Path(os.environ["CHECKOUT"]).resolve()
          print(f"imported module: {module_path}")
          assert not module_path.is_relative_to(checkout)
          assert get_logger("artifact-smoke").name == "artifact-smoke"
          record = logging.LogRecord(
              "artifact-smoke", logging.INFO, __file__, 1, "installed wheel smoke", (), None
          )
          assert "installed wheel smoke" in JsonFormatter().format(record)
          PY

  host-smoke:
    name: Real Functions host smoke (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.full_required == 'true'
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            tests/host_smoke/requirements.txt

      - name: Install Functions Core Tools v4 and Azurite
        run: |
          npm install --global azure-functions-core-tools@4 --unsafe-perm true
          npm install --global azurite

      - name: Install smoke app dependencies
        working-directory: tests/host_smoke
        run: pip install -r requirements.txt

      - name: Start Azurite and Functions host
        run: |
          azurite --silent > /tmp/azurite.log 2>&1 &
          cd tests/host_smoke
          func start --python --port 7071 > /tmp/functions-host.log 2>&1 &

      - name: Call decorated handlers
        run: |
          for attempt in {1..30}; do
            if response="$(curl --fail --silent http://127.0.0.1:7071/api/smoke)" \
              && default_response="$(curl --fail --silent http://127.0.0.1:7071/api/smoke-default)"; then
              test "$response" = "smoke"
              test "$default_response" = "smoke_default"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/functions-host.log
          exit 1

  docs-check:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs_changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install documentation checks
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]" pytest pytest-cov
          npm install -g @mermaid-js/mermaid-cli

      - name: Build documentation strictly
        run: mkdocs build --strict

      - name: Lint documentation links
        run: python tools/lint_doc_links.py

      - name: Render Mermaid diagrams
        run: python scripts/render_mermaid.py

      - name: Run documentation-dependent tests
        run: pytest tests/test_public_api.py tests/test_doc_link_tag_integrity.py --no-cov

  # The single required status check for branch protection.
  #
  # Branch protection matches required checks by literal name, so requiring
  # matrix cells couples it to the matrix: dropping a version removes the job
  # that produced that name, the check is then never reported, and GitHub holds
  # it pending forever -- blocking every PR, Dependabot and Release Please
  # included, until an admin edits settings.
  #
  # This job's name survives matrix changes. `if: always()` guarantees it always
  # reports, and it reads every dependency's result, so a skipped or cancelled
  # job cannot pass by not being a failure.
  # Expected-result table:
  # docs-only + docs success => pass; docs failure => fail
  # code + matrix success => pass; matrix skip/failure/cancellation => fail
  # classifier failure => fail because changes must report success
  ci-required:
    needs:
      - changes
      - quality
      - test
      - minimum-dependencies
      - artifact-build
      - artifact-python310-negative
      - artifact-python311
      - host-smoke
      - docs-check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate required checks
        env:
          RESULTS: ${{ toJSON(needs) }}
          FULL_REQUIRED: ${{ needs.changes.outputs.full_required }}
          DOCS_CHANGED: ${{ needs.changes.outputs.docs_changed }}
        run: |
          python3 - <<'EVAL'
          import json, os, sys

          results = json.loads(os.environ["RESULTS"])
          outputs = {
              "full_required": os.environ["FULL_REQUIRED"],
              "docs_changed": os.environ["DOCS_CHANGED"],
          }
          invalid_outputs = {
              name: value for name, value in outputs.items()
              if value not in {"true", "false"}
          }
          if invalid_outputs:
              sys.exit(f"::error::Invalid classifier outputs: {invalid_outputs}")
          if outputs == {"full_required": "false", "docs_changed": "false"}:
              sys.exit("::error::Classifier did not require any CI work")

          full_jobs = {
              "quality", "test", "minimum-dependencies", "artifact-build",
              "artifact-python310-negative", "artifact-python311", "host-smoke",
          }
          expected = {
              job: "success" if outputs["full_required"] == "true" else "skipped"
              for job in full_jobs
          }
          expected["changes"] = "success"
          expected["docs-check"] = (
              "success" if outputs["docs_changed"] == "true" else "skipped"
          )
          expected.update({job: "success" for job in results.keys() - expected.keys()})
          failed = []
          for job, wanted in sorted(expected.items()):
              actual = results[job]["result"]
              print(f"{job}: {actual} (expected {wanted})")
              if actual != wanted:
                  failed.append(job)
          if failed:
              sys.exit(f"::error::Required checks had unexpected results: {failed}")
          print("All gating jobs succeeded.")
          EVAL
