name: e2e-host-matrix

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-boot-matrix:
    name: Host-boot smoke (func ${{ matrix.core_tools }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core_tools: ["4", "4.12.0"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install Azure Functions Core Tools and Azurite
        run: npm install -g "azure-functions-core-tools@${{ matrix.core_tools }}" azurite

      - name: Install selected-interpreter development and app dependencies
        run: |
          make install-ci
          python -m pip install -r examples/e2e_app/requirements.txt

      - name: Managed host HTTP and correlation checks (not cloud ingestion)
        run: python -m tools.verification host-matrix

      - name: Upload redacted host evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: func-host-log-${{ matrix.core_tools }}
          path: test-results/**
          retention-days: 14
